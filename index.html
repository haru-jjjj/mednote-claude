
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이패드/아이폰에서 상태표시줄·홈 인디케이터 영역(safe area) 크기를
         CSS env()로 정확히 받아오기 위해 필요합니다. 실제로 콘텐츠를 그 영역 밖으로 밀어내는 건
         아래 #root 의 padding 이 담당합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 홈 화면에 추가해서 앱처럼 쓸 때 상태표시줄을 반투명(콘텐츠 위에 겹침)이 아닌
         불투명한 기본 스타일로 표시 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MediNote" />
    <meta name="theme-color" content="#ffffff" />
    <title>MediNote AI</title>
    <!-- Polyfill for importmap support in older Safari versions -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- 차분한 단일 톤: 기본 강조색(accent, 차분한 청회색) 하나 + 의미가 있을 때만 쓰는 저채도 보조색
         (sage = 업무·일치/정답, warn = 주의, clay = 환자). 오류·삭제만 red. -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: { 50: '#f3f6f9', 100: '#e4ebf2', 200: '#c9d6e3', 300: '#a3b9cf', 400: '#7795b3', 500: '#567896', 600: '#43617d', 700: '#374f66', 800: '#2f4254', 900: '#293746' },
              sage:   { 50: '#f3f6f3', 100: '#e3ebe4', 200: '#c7d7c9', 300: '#a3bda7', 400: '#7d9e82', 500: '#5f8165', 600: '#4c6a52', 700: '#3e5643', 800: '#344638', 900: '#2c3a2f' },
              warn:   { 50: '#faf6ee', 100: '#f2e9d6', 200: '#e5d3ae', 300: '#d3b77f', 400: '#bf9a55', 500: '#a8803d', 600: '#8c6a31', 700: '#70552a', 800: '#5a4525', 900: '#4a3a21' },
              clay:   { 50: '#faf5f4', 100: '#f1e4e2', 200: '#e2c7c3', 300: '#cfa49e', 400: '#b8807a', 500: '#9f655f', 600: '#86524d', 700: '#6d4340', 800: '#5a3836', 900: '#4b302f' }
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans KR', 'Noto Sans JP', 'Inter', sans-serif;
        background: #ffffff;
      }
      /* 일본어 글(lang="ja" 영역, 예: 일본어 퀴즈)은 일본에서 흔히 쓰는 고딕체로 (§5-74).
         기본 글꼴이 Noto Sans KR이라 한자·가나가 한국식 모양으로 보였음.
         iPhone·Mac = 히라기노, 그 밖 = Noto Sans JP(웹 글꼴) → 윈도 기본 Yu Gothic·Meiryo 순. 영문·숫자는 Inter 그대로,
         같은 영역의 한글(버튼 이름 등)은 일본어 글꼴에 없어 맨 끝의 Noto Sans KR로 = 앱의 다른 곳과 같은 모양 */
      :lang(ja) {
        font-family: 'Inter', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', 'YuGothic', 'Meiryo', 'Noto Sans KR', sans-serif;
      }
      /* 아이패드/아이폰: 상태표시줄·노치·홈 인디케이터 영역(safe area)만큼 앱 전체를 안쪽으로
         밀어서, 상단 메뉴가 상태표시줄 밑에 깔려 반투명하게 겹쳐 보이지 않도록 합니다.
         (일반 브라우저 탭처럼 겹칠 일이 없는 환경에서는 env() 값이 0이라 아무 변화 없음) */
      html, body {
        height: 100%;
      }
      body {
        height: 100dvh;
      }
      #root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        background: #ffffff;
      }
      /* 넓은 표(결과지 정리표 등)는 화면 밖으로 잘리지 않고 좌우 스크롤되도록 */
      .prose table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        font-size: 0.85em;
      }
      .prose table th,
      .prose table td {
        min-width: 7.5rem;
        vertical-align: top;
      }
      /* AI 요약을 메모 내용으로 옮긴 뒤 아래에 남는 "원래 메모" 접기 블록 */
      .prose details {
        margin-top: 1.5em;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        background: #f8fafc;
        padding: 0.5rem 1rem;
      }
      .prose details > summary {
        cursor: pointer;
        font-size: 0.85em;
        font-weight: 700;
        color: #64748b;
        padding: 0.25rem 0;
      }
      .prose details[open] > summary {
        margin-bottom: 0.5rem;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 0.5rem;
      }
      /* 메모 본문의 제목별 접기/펼치기 구역 (services/sectionize.ts) */
      .prose details.md-section {
        margin: 0;
        border: 0;
        border-radius: 0;
        background: none;
        padding: 0;
      }
      .prose details.md-section > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: baseline;
        gap: 0.4em;
        font-size: inherit;
        font-weight: inherit;
        color: inherit;
        padding: 0;
        margin: 1.4em 0 0.6em;
        border-bottom: 0;
      }
      .prose details.md-section[open] > summary {
        margin-bottom: 0.6em;
        padding-bottom: 0;
        border-bottom: 0;
      }
      .prose details.md-section > summary::-webkit-details-marker { display: none; }
      .prose details.md-section > summary::before {
        content: '▾';
        color: #94a3b8;
        font-size: 0.8em;
        display: inline-block;
        transition: transform 0.15s;
      }
      .prose details.md-section:not([open]) > summary::before { transform: rotate(-90deg); }
      .prose details.md-section > summary > h1,
      .prose details.md-section > summary > h2,
      .prose details.md-section > summary > h3 {
        display: inline;
        margin: 0;
      }
      /* 날짜 구역은 왼쪽 선으로 경과(타임라인)처럼 */
      .prose details.md-section.md-date > .md-section-body {
        border-left: 2px solid #c9d6e3;
        padding-left: 0.9em;
        margin-left: 0.25em;
      }
      .prose details.md-section.md-date > summary > h1,
      .prose details.md-section.md-date > summary > h2,
      .prose details.md-section.md-date > summary > h3 {
        color: #374f66;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      /* Prevent Mobile Zoom on Inputs */
      @media screen and (max-width: 768px) {
        input, textarea, select {
          font-size: 16px !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "marked": "https://aistudiocdn.com/marked@^12.0.0",
    "dompurify": "https://aistudiocdn.com/dompurify@^3.2.4",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
    "firebase/": "https://esm.sh/firebase@^12.8.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white text-slate-900 overflow-hidden w-full">
    <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
